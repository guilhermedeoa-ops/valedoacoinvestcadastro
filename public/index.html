<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro Vale do Aço Invest</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#17243b;background:#f2f6fc}*{box-sizing:border-box}body{margin:0;padding:30px 14px}.card{max-width:690px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 10px 40px #142d5420}header{text-align:center;margin-bottom:26px}.logo{font-size:38px}h1{margin:5px 0;font-size:27px}p{color:#66748a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:14px;font-weight:650}input,select{border:1px solid #cdd6e5;border-radius:9px;padding:13px;font:inherit;width:100%;background:white}input:focus,select:focus{outline:2px solid #187d74;border-color:transparent}button{background:#174c49;border:0;border-radius:10px;padding:15px;color:white;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:22px}button:disabled{opacity:.55;cursor:wait}#status{margin-top:15px;text-align:center;font-weight:600}small{color:#6a7485;display:block;text-align:center;margin-top:16px}@media(max-width:540px){.card{padding:22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main class="card"><header><div class="logo">📋</div><h1>CADASTRO VALE DO AÇO INVEST</h1><p>Preencha seus dados para realizar seu cadastro.</p></header>
<form id="form"><div class="grid">
<div class="field full"><label for="nome_completo">Nome completo</label><input id="nome_completo" required maxlength="150" autocomplete="name"></div>
<div class="field"><label for="cpf">CPF</label><input id="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div>
<div class="field"><label for="rg">RG</label><input id="rg" required maxlength="30"></div>
<div class="field"><label for="emissao_rg">Data de emissão do RG</label><input id="emissao_rg" type="date" required></div>
<div class="field"><label for="nascimento">Data de nascimento</label><input id="nascimento" type="date" required></div>
<div class="field full"><label for="nome_mae">Nome da mãe</label><input id="nome_mae" required maxlength="150"></div>
<div class="field"><label for="cidade_natal">Cidade natal</label><input id="cidade_natal" required maxlength="120"></div>
<div class="field"><label for="email">E-mail</label><input id="email" type="email" required maxlength="180" autocomplete="email"></div>
<div class="field full"><label for="endereco">Endereço completo</label><input id="endereco" required maxlength="350" placeholder="Rua, número, bairro, cidade e estado" autocomplete="street-address"></div>
<div class="field"><label for="cep">CEP</label><input id="cep" required inputmode="numeric" maxlength="9" placeholder="00000-000"></div>
<div class="field"><label for="instituicao_ensino">Instituição de ensino</label><input id="instituicao_ensino" required maxlength="200" placeholder="Nome da instituição"></div><div class="field"><label for="ano_conclusao">Ano de conclusão</label><input id="ano_conclusao" type="number" min="1900" max="2100" step="1" required placeholder="Ex.: 2022"></div><div class="field"><label for="pagamento">Forma de pagamento</label><select id="pagamento" required><option value="">Selecione</option><option value="pix">Pix</option><option value="cartao">Cartão</option></select></div>
</div><button id="enviar" type="submit">Enviar cadastro</button><div id="status" role="status" aria-live="polite"></div></form>
<small>Seus dados serão utilizados para receber e processar seu cadastro.</small></main>
<script>
const URL_API='https://brabcgkawqxrpuiwqzth.supabase.co/rest/v1/cadastros_valedoaco_invest';
const KEY='sb_publishable_k-ax_Ud_65RHvlqgzu4q8A_TIhyqLum';
const f=document.getElementById('form'),status=document.getElementById('status'),btn=document.getElementById('enviar');
function digits(v){return v.replace(/\D/g,'')}
document.getElementById('cpf').addEventListener('input',e=>{let s=digits(e.target.value).slice(0,11);e.target.value=s.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})(\d{1,2})$/,'$1-$2')});
document.getElementById('cep').addEventListener('input',e=>{let s=digits(e.target.value).slice(0,8);e.target.value=s.replace(/^(\d{5})(\d)/,'$1-$2')});
function validCpf(c){c=digits(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let sum=0;for(let i=0;i<t;i++)sum+=Number(c[i])*(t+1-i);let d=(sum*10)%11;if(d===10)d=0;if(d!==Number(c[t]))return false}return true}
f.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';const data={};for(const id of ['nome_completo','cpf','rg','emissao_rg','nome_mae','nascimento','cidade_natal','email','endereco','cep','instituicao_ensino','ano_conclusao','pagamento'])data[id]=document.getElementById(id).value.trim();data.ano_conclusao=Number(data.ano_conclusao);if(!validCpf(data.cpf)){status.textContent='Confira o CPF informado.';return}if(digits(data.cep).length!==8){status.textContent='Confira o CEP informado.';return}btn.disabled=true;btn.textContent='Enviando...';try{const res=await fetch(URL_API,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(data)});if(!res.ok)throw Error('Falha no envio');f.reset();status.style.color='#147348';status.textContent='Cadastro enviado com sucesso!';}catch(err){status.style.color='#b52d36';status.textContent='Não foi possível enviar. Tente novamente.';}finally{btn.disabled=false;btn.textContent='Enviar cadastro';}});
</script></body></html>
