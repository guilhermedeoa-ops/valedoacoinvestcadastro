<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro Vale do Aço Invest</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#f9f6ee;background:#060606}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:46px 16px;background:radial-gradient(ellipse at 70% 15%,#4a2a16 0%,#1b100b 42%,#090706 85%)}.card{max-width:800px;margin:auto;background:linear-gradient(130deg,#20170f,#100d0b);padding:36px;border:1px solid #d7a640;border-radius:18px;box-shadow:0 15px 40px #0008}header{text-align:center;margin-bottom:28px}.logo{font-size:32px;color:#f1c15c;letter-spacing:.13em;font-weight:800}h1{margin:10px 0;font-size:clamp(25px,4vw,36px);color:#f9f6ee}p{color:#d7cec1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:14px;font-weight:650;color:#f5e5c9}input,select{border:1px solid #e0bd75;border-radius:8px;padding:13px;font:inherit;width:100%;background:#faf7f0;color:#181818}input:focus,select:focus{outline:2px solid #f1c15c;border-color:transparent}button{background:linear-gradient(#ffe39a,#e9ad3e);border:1px solid #ffdf84;border-radius:10px;padding:15px;color:#17120a;font:inherit;font-weight:800;cursor:pointer;width:100%;margin-top:24px;box-shadow:0 4px 0 #805018}button:disabled{opacity:.55;cursor:wait}#status{margin-top:15px;text-align:center;font-weight:600}small{color:#c7b7a0;display:block;text-align:center;margin-top:20px}@media(max-width:540px){body{padding:18px 12px}.card{padding:22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}} .section-label{font-size:13px;color:#f1c15c;letter-spacing:.12em;font-weight:800;margin:10px 0 0;padding-bottom:8px;border-bottom:1px solid #7e6036}</style></head>
<body><main class="card"><header><div class="logo">VALE DO AÇO INVEST</div><h1>Ficha de cadastro</h1><p>Preencha os dados abaixo para análise de cadastro.</p></header>
<form id="form"><div class="grid"><div class="full section-label">👤 DADOS PESSOAIS</div><div class="field full"><label for="nome_completo">Nome completo</label><input id="nome_completo" required maxlength="150" autocomplete="name"></div>
<div class="field"><label for="profissao">Profissão</label><input id="profissao" required maxlength="150"></div>
<div class="field"><label for="estado_civil">Estado civil</label><select id="estado_civil" required><option value="">Selecione</option><option value="Solteiro(a)">Solteiro(a)</option><option value="Casado(a)">Casado(a)</option><option value="União estável">União estável</option><option value="Divorciado(a)">Divorciado(a)</option><option value="Viúvo(a)">Viúvo(a)</option></select></div>
<div class="field"><label for="cpf">CPF</label><input id="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div>
<div class="field"><label for="nascimento">Data de nascimento</label><input id="nascimento" type="date" required></div>
<div class="field full"><label for="email">E-mail</label><input id="email" type="email" required maxlength="180" autocomplete="email"></div>
<div class="full section-label">💰 DADOS FINANCEIROS</div>
<div class="field full"><label for="renda_bruta_mensal">Renda bruta mensal — individual ou familiar (R$)</label><input id="renda_bruta_mensal" required inputmode="decimal" placeholder="Ex.: 4500,00"></div>
<div class="full section-label">📍 ENDEREÇO E CONTATO</div>
<div class="field full"><label for="endereco">Endereço completo</label><input id="endereco" required maxlength="350" placeholder="Rua, número, bairro, cidade e estado" autocomplete="street-address"></div>
<div class="field"><label for="cep">CEP</label><input id="cep" required inputmode="numeric" maxlength="9" placeholder="00000-000"></div>
<div class="field"><label for="whatsapp">Celular (WhatsApp com DDD)</label><input id="whatsapp" type="tel" required inputmode="tel" maxlength="16" placeholder="(31) 99999-9999" autocomplete="tel"></div></div><button id="enviar" type="submit">Enviar cadastro</button><div id="status" role="status" aria-live="polite"></div></form>
<small>Seus dados serão utilizados para receber e processar seu cadastro.</small></main>
<script>
const URL_API='https://brabcgkawqxrpuiwqzth.supabase.co/rest/v1/cadastros_valedoaco_invest';
const KEY='sb_publishable_k-ax_Ud_65RHvlqgzu4q8A_TIhyqLum';
const f=document.getElementById('form'),status=document.getElementById('status'),btn=document.getElementById('enviar');
function digits(v){return v.replace(/\D/g,'')}
document.getElementById('cpf').addEventListener('input',e=>{let s=digits(e.target.value).slice(0,11);e.target.value=s.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})(\d{1,2})$/,'$1-$2')});
document.getElementById('cep').addEventListener('input',e=>{let s=digits(e.target.value).slice(0,8);e.target.value=s.replace(/^(\d{5})(\d)/,'$1-$2')});
function validCpf(c){c=digits(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let sum=0;for(let i=0;i<t;i++)sum+=Number(c[i])*(t+1-i);let d=(sum*10)%11;if(d===10)d=0;if(d!==Number(c[t]))return false}return true}
document.getElementById('whatsapp').addEventListener('input',e=>{let s=digits(e.target.value).slice(0,11);e.target.value=s.replace(/^(\\d{2})(\\d)/,'($1) $2').replace(/(\\d{5})(\\d{4})$/,'$1-$2')});
f.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';const data={};for(const id of ['nome_completo','profissao','estado_civil','cpf','nascimento','email','endereco','cep','whatsapp'])data[id]=document.getElementById(id).value.trim();if(!validCpf(data.cpf)){status.style.color='#ff9d9d';status.textContent='Confira o CPF informado.';return}if(digits(data.cep).length!==8){status.style.color='#ff9d9d';status.textContent='Confira o CEP informado.';return}if(digits(data.whatsapp).length<10||digits(data.whatsapp).length>11){status.style.color='#ff9d9d';status.textContent='Confira o WhatsApp com DDD.';return}const renda=document.getElementById('renda_bruta_mensal').value.trim().replace(/\\s|R\\$/g,'').replace(/\\./g,'').replace(',','.');data.renda_bruta_mensal=Number(renda);if(!Number.isFinite(data.renda_bruta_mensal)||data.renda_bruta_mensal<=0){status.style.color='#ff9d9d';status.textContent='Confira a renda mensal.';return}btn.disabled=true;btn.textContent='Enviando...';try{const res=await fetch(URL_API,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(data)});if(!res.ok)throw Error('Falha no envio');f.reset();status.style.color='#b7efba';status.textContent='Cadastro enviado com sucesso!';}catch(err){status.style.color='#ff9d9d';status.textContent='Não foi possível enviar. Tente novamente.';}finally{btn.disabled=false;btn.textContent='Enviar cadastro';}});
</script></body></html>
